<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abu Darda | Personal Website</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 40px 20px;
    }

    .profile {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid white;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #ccc;
      font-size: 18px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 25px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="profile.jpg" class="profile" alt="Abu Darda">

    <h1>Abu Darda</h1>

    <p>
      Welcome to my personal website.<br>
      Dream Big • Work Hard • Keep Growing
    </p>

    <a href="#" class="button">My Profile</a>

  </div>

</body>
</html>
